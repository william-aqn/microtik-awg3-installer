name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python tools/verify_repo.py
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false
      - run: go test -race ./...
        working-directory: panel
      - run: go vet ./...
        working-directory: panel
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -o /tmp/awg-panel .
        working-directory: panel
      - run: docker build --platform linux/amd64 --provenance=false -t awg-control:test panel
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o /tmp/awg-native-test
        working-directory: panel
      - run: docker run --rm --cap-add NET_ADMIN --device /dev/net/tun -e AWG_NATIVE_TEST=1 -v /tmp/awg-native-test:/native-test:ro --entrypoint /native-test awg-control:test -test.run=TestNativeEngineLifecycle -test.v
